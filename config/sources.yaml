# sports_jobs/config/sources.yaml
#
# All MLB, NBA, and NFL team job sources with verified URLs.
#
# ATS types with working scrapers:
#   greenhouse     - public REST API, very reliable
#   lever          - public REST API, very reliable
#   workday        - internal CXS API, reliable
#   teamworkonline - HTML scraping, sport-level aggregator pages
#   dayforce       - needs fixing
#   generic        - HTML fallback (best-effort)
#
# ATS types NOT yet implemented (see commented section at bottom):
#   ukgpro  - 9 teams
#   adp     - 6 teams
#   paycor  - 3 teams

