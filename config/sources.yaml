# front_office_wire/config/sources.yaml
#
# Add/remove sources here. Supported types: greenhouse, lever, workday, teamworkonline, generic
#
# Greenhouse: find the board token from the careers page URL or page source.
#   e.g. https://boards.greenhouse.io/nba -> token is "nba"
#
# Lever: find the company slug from https://jobs.lever.co/{company}
#
# Workday: URL is parsed automatically. Override with params if needed.

